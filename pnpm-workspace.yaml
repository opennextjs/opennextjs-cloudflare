packages:
  - packages/*
  - examples/*
  - examples/e2e/*
  - examples/bugs/*
  - examples/overrides/*
  - "!examples/common"
  - benchmarking

overrides:
  # Prevent Wrangler's peer auto-install from resolving beyond the reviewed types release.
  "@cloudflare/workers-types": 5.20261007.1
  # Keep Next.js optional peer contexts on the same reviewed Playwright/browser release.
  "@playwright/test": 1.63.0

