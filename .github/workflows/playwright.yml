name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Examples are always selected within `./examples/**` so that the root package (whose `e2e` scripts recurse)
        # is never selected. The "webpack (others)" shard catches every example not explicitly listed in another shard.
        include:
          - name: webpack (app-router)
            filter: --filter app-router
            build: build:worker
            e2e: e2e
            browsers: chromium
          - name: webpack (app-pages-router, pages-router, experimental)
            filter: --filter app-pages-router --filter pages-router --filter experimental
            build: build:worker
            e2e: e2e
            browsers: chromium
          - name: webpack (overrides, bugs)
            filter: --filter "./examples/overrides/*" --filter "./examples/bugs/*"
            build: build:worker
            e2e: e2e
            browsers: chromium
          - name: webpack (others)
            filter: >-
              --filter "./examples/**"
              --filter "!app-router" --filter "!app-pages-router" --filter "!pages-router" --filter "!experimental"
              --filter "!./examples/overrides/*" --filter "!./examples/bugs/*"
            build: build:worker
            e2e: e2e
            # `create-next-app` and `middleware` test on multiple browsers
            browsers: ""
          - name: turbopack
            filter: --filter "./examples/**"
            build: build:worker-turbopack
            e2e: e2e-turbopack
            browsers: chromium
          - name: dev
            filter: --filter "./examples/**"
            build: ""
            e2e: e2e:dev
            browsers: chromium
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.browsers }}

      - name: Build workers
        if: matrix.build != ''
        run: pnpm ${{ matrix.filter }} run ${{ matrix.build }}

      - name: Run playwright tests
        run: pnpm ${{ matrix.filter }} run ${{ matrix.e2e }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: examples/**/playwright-report
          retention-days: 1
